name: Build APK

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'android/**'
      - '.github/workflows/build-apk.yml'
      - '.github/interface-lock.sha'
      - 'scripts/check-interface-lock.sh'
      - '.github/interface-lock.sha'
      - 'scripts/check-interface-lock.sh'
  push:
    branches: [main]
    paths:
      - 'android/**'
      - '.github/workflows/build-apk.yml'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Enforce approved Lovable interface lock
        run: bash scripts/check-interface-lock.sh

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install required Android SDK packages
        shell: bash
        run: |
          set -euo pipefail
          SDK_ROOT="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          test -d "$SDK_ROOT/cmdline-tools"
          SDKMANAGER="$(find "$SDK_ROOT/cmdline-tools" -type f -name sdkmanager | sort -V | tail -n 1)"
          test -n "$SDKMANAGER"
          export ANDROID_HOME="$SDK_ROOT"
          export ANDROID_SDK_ROOT="$SDK_ROOT"
          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> "$GITHUB_ENV"
          set +o pipefail
          yes | "$SDKMANAGER" --licenses >/dev/null
          set -o pipefail
          "$SDKMANAGER" "platforms;android-35" "build-tools;35.0.0" "platform-tools"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Compile native Android APK
        working-directory: android
        run: gradle testDebugUnitTest assembleDebug --no-daemon

      - name: Verify APK package and signature
        shell: bash
        run: |
          set -euo pipefail
          APK="android/app/build/outputs/apk/debug/app-debug.apk"
          test -s "$APK"
          unzip -t "$APK" >/dev/null
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$APK" | grep -F "package: name='com.kellvyn.assistant'"
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify "$APK"
          cp "$APK" Kellvyn-IA.apk

      - uses: actions/upload-artifact@v4
        with:
          name: Kellvyn-IA-APK
          path: Kellvyn-IA.apk
          if-no-files-found: error
          retention-days: 30

      - name: Publish Release with direct APK
        if: success() && github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: Kellvyn IA nativa v1.0.${{ github.run_number }}
          files: Kellvyn-IA.apk
          generate_release_notes: true
