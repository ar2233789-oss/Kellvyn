[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "kellvyn-brain-lab"
version = "0.1.0"
description = "Prototype neural foundation trained from random initialization for Kellvyn"
requires-python = ">=3.10"
dependencies = ["torch>=2.2"]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
kellvyn-train = "kellvyn_brain.train:main"
kellvyn-tokenizer-benchmark = "kellvyn_brain.tokenizer_benchmark:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
