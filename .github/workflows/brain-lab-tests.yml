name: Kellvyn brain lab tests

on:
  push:
    branches:
      - brain/from-scratch-foundation
    paths:
      - "brain-lab/**"
      - "docs/BRAIN_*.md"
      - ".github/workflows/brain-lab-tests.yml"
  pull_request:
    paths:
      - "brain-lab/**"
      - "docs/BRAIN_*.md"
      - ".github/workflows/brain-lab-tests.yml"

permissions:
  contents: read

jobs:
  cpu-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: brain-lab/pyproject.toml
      - name: Install experimental lab
        run: python -m pip install -e "brain-lab[dev]"
      - name: Run foundation tests
        run: python -m pytest brain-lab/tests -q
