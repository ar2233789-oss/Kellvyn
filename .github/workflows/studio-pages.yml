name: Publish isolated production studio

on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: studio-pages
  cancel-in-progress: false

jobs:
  publish:
    name: Publish static studio
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout studio branch
        uses: actions/checkout@v4
      - name: Configure existing GitHub Pages site
        uses: actions/configure-pages@v5
      - name: Package the studio directory
        uses: actions/upload-pages-artifact@v3
        with:
          path: studio
      - name: Deploy Pages site
        id: deployment
        uses: actions/deploy-pages@v4
