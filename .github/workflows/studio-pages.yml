name: Publish Kellvyn Studio preview

on:
  push:
    branches:
      - studio-production-suite
    paths:
      - "studio/**"
      - ".github/workflows/studio-pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: studio-pages
  cancel-in-progress: false

jobs:
  publish:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Studio
        uses: actions/checkout@v4
        with:
          ref: studio-production-suite
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Package interactive Studio
        uses: actions/upload-pages-artifact@v3
        with:
          path: studio
      - name: Publish Studio
        id: deployment
        uses: actions/deploy-pages@v4
