name: Studio — Virtual Poco F6 smoke test

on:
  push:
    branches:
      - studio-production-suite
    paths:
      - "studio/**"
      - ".github/workflows/studio-poco-f6-lab.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: studio-poco-f6-lab-${{ github.ref }}
  cancel-in-progress: true

jobs:
  virtual-device-smoke:
    name: Build current native app and inspect it on virtual Android 15
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout Studio memory and test metadata
        uses: actions/checkout@v4

      - name: Checkout current native Android app from main
        uses: actions/checkout@v4
        with:
          ref: main
          path: source-main

      - name: Prepare evidence directory
        run: mkdir -p studio-artifacts input-apk

      - name: Set up Java and Android SDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android SDK packages
        shell: bash
        run: |
          set -euo pipefail
          SDK_ROOT="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          SDKMANAGER="$(find "$SDK_ROOT/cmdline-tools" -type f -name sdkmanager | sort -V | tail -n 1)"
          test -n "$SDKMANAGER"
          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> "$GITHUB_ENV"
          set +o pipefail
          yes | "$SDKMANAGER" --licenses >/dev/null
          set -o pipefail
          "$SDKMANAGER" "platforms;android-35" "build-tools;35.0.0" "platform-tools"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Compile and unit-test the latest native app from main
        working-directory: source-main
        shell: bash
        run: |
          set -euo pipefail
          chmod +x ./gradlew
          ./gradlew --no-daemon --stacktrace testDebugUnitTest assembleDebug

      - name: Record the freshly compiled APK and source identity
        shell: bash
        run: |
          set -euo pipefail
          APK="source-main/app/build/outputs/apk/debug/app-debug.apk"
          test -s "$APK"
          cp "$APK" input-apk/app-debug.apk
          sha256sum input-apk/app-debug.apk | tee studio-artifacts/apk-sha256.txt
          SOURCE_COMMIT="$(git -C source-main rev-parse HEAD)"
          printf "Native source commit: %s\n" "$SOURCE_COMMIT" > studio-artifacts/test-scope.txt
          printf "Built source: main/app (Kotlin/Jetpack Compose)\n" >> studio-artifacts/test-scope.txt

      - name: Boot Android 15 virtual device and collect UI evidence
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          cores: 4
          ram-size: 8192M
          heap-size: 512M
          disk-size: 8G
          avd-name: studio-poco-f6-virtual
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
          disable-animations: false
          emulator-boot-timeout: 600
          script: bash studio/run-poco-f6-smoke.sh

      - name: Publish a direct APK download after the virtual-device smoke test
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          TAG="kellvyn-native-build-${GITHUB_RUN_NUMBER}-${GITHUB_RUN_ATTEMPT}"
          APK="input-apk/app-debug.apk"
          test -s "$APK"
          gh release create "$TAG" "$APK" \
            --repo "$GITHUB_REPOSITORY" \
            --title "Kellvyn IA — APK nativa (build ${GITHUB_RUN_NUMBER})" \
            --notes "APK Android nativo compilado da branch main (ver SHA do código em test-scope.txt) e publicado somente após passar as verificações automatizadas e a instalação/inicialização no Android 15 virtual. Assinatura de depuração do Gradle; não é uma build de loja. O teste virtual não equivale a um teste físico no Poco F6 e o smoke test mantém a inferência de modelo offline." 
          echo "https://github.com/${GITHUB_REPOSITORY}/releases/download/${TAG}/app-debug.apk" | tee studio-artifacts/apk-download-url.txt

      - name: Upload screenshot, hierarchy, logs and APK identity
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: studio-poco-f6-virtual-evidence-${{ github.run_number }}
          path: studio-artifacts/
          if-no-files-found: warn
          retention-days: 14
