name: Studio Native Port QA

on:
  push:
    branches:
      - studio-production-suite
    paths:
      - studio/native-port/android/**
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: studio-native-port-qa
  cancel-in-progress: true

jobs:
  build-native:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: studio-production-suite
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Android SDK packages
        shell: bash
        run: |
          set -euo pipefail
          SDK_ROOT="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          SDKMANAGER="$(find "$SDK_ROOT/cmdline-tools" -type f -name sdkmanager | sort -V | tail -n 1)"
          test -n "$SDKMANAGER"
          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> "$GITHUB_ENV"
          set +o pipefail
          yes | "$SDKMANAGER" --licenses >/dev/null
          set -o pipefail
          "$SDKMANAGER" "platforms;android-35" "build-tools;35.0.0" "platform-tools"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - name: Run native unit tests and build APK
        working-directory: studio/native-port/android
        run: gradle testDebugUnitTest assembleDebug --no-daemon
      - name: Verify generated APK
        shell: bash
        run: |
          set -euo pipefail
          APK="studio/native-port/android/app/build/outputs/apk/debug/app-debug.apk"
          test -s "$APK"
          unzip -t "$APK" >/dev/null
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$APK" | grep -F "package: name='com.kellvyn.assistant'"
      - uses: actions/upload-artifact@v4
        with:
          name: Kellvyn-Studio-Native-Port-APK
          path: studio/native-port/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
