name: Local compiler smoke test

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
concurrency:
  group: local-compiler-smoke-${{ github.ref }}
  cancel-in-progress: true

jobs:
  compiler-smoke:
    name: Builder -> agent tool -> on-device APK pipeline
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Check out Kellvyn source
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK tools
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Set up Gradle (only to build the Kellvyn test harness)
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: "8.9"

      - name: Bundle the real offline model for end-to-end AI generation test
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p app/src/main/assets/models
          MODEL_FILE="app/src/main/assets/models/kellvyn-model.litertlm"
          curl --fail --location --retry 4 --retry-delay 2 --connect-timeout 20 --max-time 900 \
            "https://huggingface.co/litert-community/SmolLM2-360M-Instruct/resolve/main/SmolLM2_360M_instruct.litertlm?download=true" \
            --output "$MODEL_FILE"
          printf "%s  %s\\n" "8e2834da211b439751af968ed650febdde5a8cb8d88bc6c1a3059f049caa5c2e" "$MODEL_FILE" | sha256sum --check --strict

      # The sample app itself is NOT built by Gradle. The instrumentation test
      # runs ECJ -> D8 -> BinaryAndroidManifest -> apksig inside the installed
      # Kellvyn process, the same local toolchain exposed to the chat agent.
      - name: Run unit tests and local compiler integration test in Android emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_2
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none -partition-size 8192
          cores: 4
          emulator-boot-timeout: 1200
          script: |
            set +e
            gradle --no-daemon testDebugUnitTest
            unit_status=$?
            gradle --no-daemon connectedDebugAndroidTest
            android_status=$?
            set -e
            mkdir -p app/build/qa
            echo "Emulator disk state after tests:" > app/build/qa/emulator-diagnostics.txt
            adb shell df -h /data >> app/build/qa/emulator-diagnostics.txt 2>&1 || true
            adb shell pm list packages com.kellvyn.assistant >> app/build/qa/emulator-diagnostics.txt 2>&1 || true
            adb shell run-as com.kellvyn.assistant cat files/kellvyn_qa/model-acceptance-report.md > app/build/qa/model-acceptance-report.md 2> app/build/qa/report-pull-error.txt || true
            if [ -s app/build/qa/model-acceptance-report.md ]; then
              echo "Model acceptance report retrieved from emulator."
            else
              echo "No model acceptance report was produced or could be retrieved."
            fi
            if [ "$unit_status" -ne 0 ] || [ "$android_status" -ne 0 ]; then exit 1; fi

      - name: Upload emulator QA report and Android test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Kellvyn-Deep-QA-Report
          path: |
            app/build/qa/
            app/build/reports/androidTests/connected/
            app/build/outputs/androidTest-results/connected/
            app/build/reports/tests/testDebugUnitTest/
          if-no-files-found: warn
          retention-days: 14
