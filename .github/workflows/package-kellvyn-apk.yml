name: Package Kellvyn IA APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: package-kellvyn-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  package:
    name: Build installable Kellvyn APK
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out Kellvyn source
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools platforms;android-35 build-tools;35.0.0

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: "8.9"
      - name: Bundle the offline on-device language model
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p app/src/main/assets/models
          MODEL_FILE="app/src/main/assets/models/kellvyn-model.litertlm"
          curl --fail --location --retry 4 --retry-delay 2 --connect-timeout 20 --max-time 900 \
            "https://huggingface.co/litert-community/SmolLM2-360M-Instruct/resolve/main/SmolLM2_360M_instruct.litertlm?download=true" \
            --output "$MODEL_FILE"
          printf "%s  %s\n" "8e2834da211b439751af968ed650febdde5a8cb8d88bc6c1a3059f049caa5c2e" "$MODEL_FILE" | sha256sum --check --strict
          cat > app/src/main/assets/models/MODEL-NOTICE.txt <<'NOTICE'
Kellvyn IA bundles SmolLM2-360M-Instruct in the APK so first-run chat can work offline.
Model source: https://huggingface.co/litert-community/SmolLM2-360M-Instruct
Model license declared by the model card: Apache-2.0.
The model is copied into private app storage and inference runs locally. No prompts are sent to a provider.
NOTICE

      # This workflow packages the Kellvyn host app for installation.
      # Apps created inside Kellvyn still use LocalAndroidCompiler on the phone;
      # this workflow is never invoked by the in-app project builder.
      - name: Assemble installable debug APK
        run: gradle --no-daemon assembleDebug

      - name: Run JVM unit tests
        run: gradle --no-daemon testDebugUnitTest

      - name: Upload APK and test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Kellvyn-IA-APK
          path: |
            app/build/outputs/apk/debug/app-debug.apk
            app/build/reports/tests/testDebugUnitTest/
          if-no-files-found: warn
          retention-days: 14
