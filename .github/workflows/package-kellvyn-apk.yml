name: Package Kellvyn IA APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: package-kellvyn-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  package:
    name: Build installable Kellvyn APK
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out Kellvyn source
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools platforms;android-35 build-tools;35.0.0

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: "8.9"

      # This workflow packages the Kellvyn host app for installation.
      # Apps created inside Kellvyn still use LocalAndroidCompiler on the phone;
      # this workflow is never invoked by the in-app project builder.
      - name: Assemble installable debug APK
        run: gradle --no-daemon assembleDebug

      - name: Run JVM unit tests
        run: gradle --no-daemon testDebugUnitTest

      - name: Upload APK and test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Kellvyn-IA-APK
          path: |
            app/build/outputs/apk/debug/app-debug.apk
            app/build/reports/tests/testDebugUnitTest/
          if-no-files-found: warn
          retention-days: 14
